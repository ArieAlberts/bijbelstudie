name: Finalize Haazinu upload

on:
  push:
    branches:
      - haazinu-upload-temp-2
    paths:
      - '.haazinu-source/READY'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: haazinu-upload-temp-2
          fetch-depth: 0

      - name: Reconstruct and verify corrected source
        shell: bash
        run: |
          set -euo pipefail
          cat .haazinu-source/part0* > /tmp/haazinu.md
          cp .haazinu-source/OVERZICHT.md /tmp/OVERZICHT.md
          echo '9c1daf49944a5eb4e13a37acf9a74d3d5530d06320064df76c0b2e10b86f485e  /tmp/haazinu.md' | sha256sum -c -
          echo 'a9942febb97f75321fda0729ec4d00c859df5934a943d959bdc8d355c9e0b883  /tmp/OVERZICHT.md' | sha256sum -c -
          grep -q 'waar zijn wíj wegbewogen van de Rots' /tmp/haazinu.md
          grep -q 'Als ik in deze richting vijf jaar doorga' /tmp/haazinu.md
          grep -q 'vanwege wat er gebeurde bij Meriba' /tmp/haazinu.md
          grep -q 'Hij doodt én maakt levend' /tmp/haazinu.md
          ! grep -q 'van de Rots vandaan bewogen' /tmp/haazinu.md
          ! grep -q 'gedüwd' /tmp/haazinu.md
          ! grep -q 'Hij doodén maakt levend' /tmp/haazinu.md
          ! grep -q 'from the Rock from the Rock' /tmp/haazinu.md

      - name: Generate Haazinu documents with repository generator
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/haazinu.md content/parasjot/haazinu.md
          npm ci
          npm run build:docs

          mkdir -p /tmp/generated/public/downloads/{lezingen,studiebladen,werkbladen}
          for ext in docx pdf; do
            cp "public/downloads/lezingen/haazinu-lezing-nl.${ext}" "/tmp/generated/public/downloads/lezingen/haazinu-lezing-nl.${ext}"
            cp "public/downloads/lezingen/haazinu-reading-en.${ext}" "/tmp/generated/public/downloads/lezingen/haazinu-lezing-en.${ext}"
            cp "public/downloads/studiebladen/haazinu-studieblad-nl.${ext}" "/tmp/generated/public/downloads/studiebladen/haazinu-studieblad-nl.${ext}"
            cp "public/downloads/studiebladen/haazinu-study-sheet-en.${ext}" "/tmp/generated/public/downloads/studiebladen/haazinu-studieblad-en.${ext}"
            cp "public/downloads/werkbladen/haazinu-werkblad-nl.${ext}" "/tmp/generated/public/downloads/werkbladen/haazinu-werkblad-nl.${ext}"
            cp "public/downloads/werkbladen/haazinu-worksheet-en.${ext}" "/tmp/generated/public/downloads/werkbladen/haazinu-werkblad-en.${ext}"
          done

          test "$(find /tmp/generated/public/downloads -type f | wc -l)" -eq 12
          for f in /tmp/generated/public/downloads/*/*.docx; do unzip -t "$f" >/dev/null; done
          for f in /tmp/generated/public/downloads/*/*.pdf; do test "$(head -c 4 "$f")" = '%PDF'; done

          git reset --hard HEAD
          git clean -fd public/downloads

      - name: Apply atomically to main, validate, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Haazinu deploy'
          git config user.email '48785326+ArieAlberts@users.noreply.github.com'
          git checkout main
          git pull --ff-only origin main

          mkdir -p content/parasjot public/downloads/{lezingen,studiebladen,werkbladen}
          cp /tmp/haazinu.md content/parasjot/haazinu.md
          cp /tmp/OVERZICHT.md content/parasjot/OVERZICHT.md
          cp /tmp/generated/public/downloads/lezingen/haazinu-* public/downloads/lezingen/
          cp /tmp/generated/public/downloads/studiebladen/haazinu-* public/downloads/studiebladen/
          cp /tmp/generated/public/downloads/werkbladen/haazinu-* public/downloads/werkbladen/
          rm -f content/parasjot/haazinu.tmp-check

          for f in $(grep -oE '/downloads/[^\"]+' content/parasjot/haazinu.md); do
            test -f "public$f" || { echo "Missing download: $f"; exit 1; }
          done
          test "$(grep -oE '/downloads/[^\"]+' content/parasjot/haazinu.md | sort -u | wc -l)" -eq 12
          ! test -e content/parasjot/haazinu.tmp-check

          # Verify that the content pipeline can parse the corrected source.
          npm run build:passages
          npm run build:downloads
          git restore data public/data 2>/dev/null || true

          git add content/parasjot/haazinu.md content/parasjot/OVERZICHT.md \
            public/downloads/lezingen/haazinu-* \
            public/downloads/studiebladen/haazinu-* \
            public/downloads/werkbladen/haazinu-*
          git add -u content/parasjot/haazinu.tmp-check || true

          CHANGED=$(git diff --cached --name-only | wc -l)
          test "$CHANGED" -eq 15
          git commit -m "Ha'azinu: finalize bilingual reading and downloads"
          git push origin main

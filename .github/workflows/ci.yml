name: CI Build Check

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build passages index
        run: npm run build:passages

      - name: Build Bible data
        run: npm run build:bible

      - name: Build downloads manifest
        run: npm run build:downloads

      - name: Build articles
        run: npm run build:articles

      - name: Copy static assets
        run: npm run build:assets

      - name: Vite build
        run: npx vite build

name: Bootstrap Shemini Atzeret Bible cache

on:
  push:
    paths:
      - '.github/workflows/bootstrap-shemini-cache.yml'

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch authentic 1 Kings 8 cache
        run: node scripts/fetch-one-authentic-chapter.mjs 1Kgs 8
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/authentic-bible-cache.json
          if git diff --cached --quiet; then
            echo "Cache already complete."
          else
            git commit -m "chore: cache 1 Kings 8 for Shemini Atzeret"
            git push
          fi

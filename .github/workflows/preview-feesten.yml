name: Preview Bijbelse Feesten

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'nl/feesten/**'
      - 'assets/css/feesten.css'
      - 'content/feesten/**'
      - 'vite.config.js'
      - '.github/workflows/preview-feesten.yml'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: bijbelse-feesten-preview
          path: dist

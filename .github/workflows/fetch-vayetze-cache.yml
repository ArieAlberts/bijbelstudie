name: Fetch Vayetze Bible Cache
# Requires Gen.28-32, Hos.12-14 and John.1 in CHAPTER_CONFIG of scripts/fetch-all-authentic-bible.mjs.

on:
  push:
    paths:
      - ".github/workflows/fetch-vayetze-cache.yml"

permissions:
  contents: write

jobs:
  fetch-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch authentic DSV and KJV data
        run: >
          node scripts/fetch-all-authentic-bible.mjs
          --only Gen.28,Gen.29,Gen.30,Gen.31,Gen.32,Hos.12,Hos.13,Hos.14,John.1
          --out scripts/vayetze-bible-cache.json
      - name: Validate fetched coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('scripts/vayetze-bible-cache.json','utf8'));
          const required = [
            ['Gen',28,10,22],['Gen',29,1,35],['Gen',30,1,43],['Gen',31,1,55],['Gen',32,1,2],
            ['Hos',12,1,14],['Hos',13,1,15],['Hos',14,1,9],['John',1,41,51]
          ];
          for (const [b,c,s,e] of required) {
            for (let v=s; v<=e; v++) {
              const k=`${b}.${c}.${v}`;
              if (!d[k]?.sv || !d[k]?.kjv) throw new Error(`Missing ${k}`);
            }
          }
          console.log(`Validated ${Object.keys(d).length} cached verses`);
          NODE
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/vayetze-bible-cache.json
          if git diff --cached --quiet; then
            echo "No cache changes"
          else
            git commit -m "Bible data: voeg authentieke Vayetze cache toe"
            git push
          fi


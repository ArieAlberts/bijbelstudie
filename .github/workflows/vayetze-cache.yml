name: Restore Vayetze authentic Bible cache
on:
  push:
    branches: ["fix-vayetze-bible-2026-11"]
    paths:
      - "scripts/fetch-vayetze-bible-cache.mjs"
      - ".github/workflows/vayetze-cache.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and validate public-domain verse snapshot
        run: node scripts/fetch-vayetze-bible-cache.mjs
      - name: Commit verified cache to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/vayetze-bible-cache.json
          git diff --cached --quiet || git commit -m "Add verified Vayetze SV/KJV verse snapshot"
          git push origin HEAD:fix-vayetze-bible-2026-11

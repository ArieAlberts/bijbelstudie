name: Fetch Toldot Bible Cache
# Requires Gen.25-28, Mal.1-2 and Matt.10 in CHAPTER_CONFIG of scripts/fetch-all-authentic-bible.mjs.

on:
  push:
    paths:
      - ".github/workflows/fetch-toldot-cache.yml"

permissions:
  contents: write

jobs:
  fetch-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch authentic DSV and KJV data
        run: >
          node scripts/fetch-all-authentic-bible.mjs
          --only Gen.25,Gen.26,Gen.27,Gen.28,Mal.1,Mal.2,Matt.10
          --out scripts/toldot-bible-cache.json
      - name: Validate fetched coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('scripts/toldot-bible-cache.json','utf8'));
          const required = [
            ['Gen',25,19,34],['Gen',26,1,35],['Gen',27,1,46],['Gen',28,1,9],
            ['Mal',1,1,14],['Mal',2,1,7],['Matt',10,21,38]
          ];
          for (const [b,c,s,e] of required) {
            for (let v=s; v<=e; v++) {
              const k=`${b}.${c}.${v}`;
              if (!d[k]?.sv || !d[k]?.kjv) throw new Error(`Missing ${k}`);
            }
          }
          console.log(`Validated ${Object.keys(d).length} cached verses`);
          NODE
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/toldot-bible-cache.json
          if git diff --cached --quiet; then
            echo "No cache changes"
          else
            git commit -m "Bible data: voeg authentieke Toldot cache toe"
            git push
          fi


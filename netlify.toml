[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/handleiding"
  to = "/nl/handleiding.html"
  status = 301

[[redirects]]
  from = "/handbook"
  to = "/en/handbook.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/nl/contact.html"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/nl/privacy.html"
  status = 301

[[redirects]]
  from = "/bedankt"
  to = "/nl/bedankt.html"
  status = 301

[[redirects]]
  from = "/thanks"
  to = "/en/thanks.html"
  status = 301

<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Zelf de parasja lezen · 404</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <script>
    // GitHub Pages SPA 404 fallback routing
    (function () {
      var path = window.location.pathname;
      if (path.includes('/nl/') || path.includes('/en/')) {
        window.location.replace(path);
      } else {
        window.location.replace('/nl/index.html');
      }
    })();
  </script>
</head>
<body class="root-language-body">
  <main class="language-card" id="main">
    <h1>Pagina niet gevonden</h1>
    <p><a href="/nl/index.html">Ga terug naar het werkblad</a></p>
  </main>
</body>
</html>

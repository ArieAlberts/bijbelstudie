<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#954c28" />
      <stop offset="100%" stop-color="#6c2c0e" />
    </linearGradient>
    <linearGradient id="shofarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c89b" />
      <stop offset="50%" stop-color="#d49b6a" />
      <stop offset="100%" stop-color="#954c28" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa" />
      <stop offset="100%" stop-color="#f4ead9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#261d16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#fffdfa" stroke-width="4" stroke-opacity="0.2" />

  <g filter="url(#dropShadow)">
    <!-- Shofar Horn (curving from left-bottom towards upper right) -->
    <path d="M 120 370 
             C 100 320, 110 240, 170 180 
             C 220 130, 290 100, 370 85 
             C 385 82, 400 95, 395 110 
             C 390 125, 375 130, 350 135 
             C 290 148, 235 175, 198 215 
             C 160 255, 150 305, 165 355 
             Z" 
          fill="url(#shofarGrad)" 
          stroke="#261d16" 
          stroke-width="6" 
          stroke-linejoin="round" />

    <!-- Shofar Mouthpiece & Ribs -->
    <path d="M 120 370 C 115 385, 130 395, 142 385 L 165 355 Z" fill="#6c2c0e" stroke="#261d16" stroke-width="4" />
    <path d="M 210 195 C 230 215, 240 240, 245 255" fill="none" stroke="#6c2c0e" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <path d="M 260 155 C 285 175, 295 195, 305 215" fill="none" stroke="#6c2c0e" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <path d="M 315 122 C 340 135, 355 150, 365 165" fill="none" stroke="#6c2c0e" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <!-- Sound Waves / Ruach Rays from Shofar -->
    <path d="M 405 75 Q 430 60 445 75" fill="none" stroke="#fffdfa" stroke-width="6" stroke-linecap="round" opacity="0.85" />
    <path d="M 420 95 Q 450 85 465 105" fill="none" stroke="#fffdfa" stroke-width="6" stroke-linecap="round" opacity="0.85" />

    <!-- Open Bible Book Base Shadow/Cover -->
    <path d="M 120 380 Q 256 420 392 380 L 396 280 Q 256 320 116 280 Z" fill="#261d16" />

    <!-- Open Bible Left Page -->
    <path d="M 124 372 Q 256 405 256 305 Q 124 275 124 372 Z" fill="url(#pageGrad)" stroke="#dbcec4" stroke-width="3" />

    <!-- Open Bible Right Page -->
    <path d="M 388 372 Q 256 405 256 305 Q 388 275 388 372 Z" fill="url(#pageGrad)" stroke="#dbcec4" stroke-width="3" />

    <!-- Bible Spine Center Divider -->
    <path d="M 256 305 L 256 400" stroke="#954c28" stroke-width="5" stroke-linecap="round" />

    <!-- Book Page Text Lines (Scripture representation) -->
    <!-- Left Page Lines -->
    <line x1="150" y1="310" x2="235" y2="322" stroke="#615248" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="150" y1="330" x2="235" y2="342" stroke="#615248" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="150" y1="350" x2="220" y2="360" stroke="#615248" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- Right Page Lines -->
    <line x1="277" y1="322" x2="362" y2="310" stroke="#615248" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="277" y1="342" x2="362" y2="330" stroke="#615248" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="277" y1="360" x2="347" y2="350" stroke="#615248" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- Golden Star of David / Cross / Menorah subtle Emblem in Spine -->
    <circle cx="256" cy="350" r="14" fill="#954c28" opacity="0.15" />
  </g>
</svg>